name: Pokemon lifecycle integrity
on:
  pull_request:
    paths:
      - 'pokemon/**'
      - 'utils/fusion.py'
      - 'utils/pokemon_utils.py'
      - 'utils/display.py'
      - 'utils/inventory_view.py'
      - 'utils/battle_display.py'
      - 'commands/cmdsets/pokemon_core.py'
      - 'commands/cmdsets/battle.py'
      - 'commands/player/cmd_challenge.py'
      - 'commands/debug/command.py'
      - 'commands/player/cmd_sheet.py'
      - 'commands/player/cmd_battle_retry.py'
      - 'server/conf/at_server_startstop.py'
      - 'server/conf/settings.py'
      - 'server/conf/telnet.py'
      - 'server/conf/amp.py'
      - 'utils/server_logging.py'
      - 'commands/player/cmd_nickname.py'
      - 'menus/capture_nickname.py'
      - 'typeclasses/characters.py'
      - 'typeclasses/exits.py'
      - 'commands/player/cmd_account.py'
      - 'commands/player/cmd_learn_evolve.py'
      - 'commands/player/cmd_party.py'
      - 'commands/player/cmd_battle_concede.py'
      - 'commands/player/cmd_gym.py'
      - 'world/hunt_system.py'
      - 'typeclasses/accounts.py'
      - 'menus/chargen.py'
      - 'conftest.py'
      - 'pytest.ini'
      - 'Makefile'
      - 'tools/run_mandatory_tests.py'
      - 'docs/offline-battle-testing.md'
      - 'tests/**'
      - 'services/battle/commit_adapter.py'
      - '.github/workflows/lifecycle-integrity.yml'
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PF2_TEST_POSTGRES_DSN: 'postgresql://postgres:postgres@localhost:5432/fusion2_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Real ORM transactions, deferred constraints and concurrent writers
        run: python tests/integration/placement_cases.py
      - name: Evolution and held-item transactions and concurrent retries
        run: python tests/integration/evolution_cases.py
      - name: NPC challenge constructor failure and persistent cleanup retries
        run: python tests/integration/trainer_challenge_cases.py
      - name: Evolution conditions and commands
        run: pytest -q tests/test_evolution.py tests/test_evolution_conditions.py tests/test_evolve_command_safety.py tests/test_hold_command_safety.py
      - name: Adventure and gym recovery with concurrent PostgreSQL claims
        run: python tests/integration/recovery_cases.py
      - name: Battle EXP, HP, PP and post-win healing on PostgreSQL
        run: python tests/integration/progression_cases.py
      - name: Battle reward retries, atomic turn checkpoints and lifecycle recovery
        run: python tests/integration/battle_recovery_cases.py
      - name: Legal AI actions, reserve switches and checkpoint rebuilds
        run: python tests/integration/ai_action_cases.py
      - name: Doubles AI scoring, Trick Room and checkpoint rebuilds
        run: python tests/integration/ai_scoring_cases.py
      - name: Player doubles commands, targets and complete battle
        run: python tests/integration/player_doubles_cases.py
      - name: Move and species name variants on PostgreSQL
        run: python tests/integration/name_resolution_cases.py
      - name: Battle item targets and persistent status on PostgreSQL
        run: python tests/integration/status_item_cases.py
      - name: Center healing locks and canonical party-slot commands on PostgreSQL
        run: python tests/integration/cloud_gameplay_cases.py
      - name: Real AMP input routing through reload and session synchronization
        run: python tests/integration/amp_reload_cases.py
      - name: Capture replay debits and durable Ether restoration on PostgreSQL
        run: python tests/integration/capture_ether_cases.py
      - name: Captured PP, Full Restore and inventory name aliases on PostgreSQL
        run: python tests/integration/capture_pp_item_cases.py
      - name: Capture nickname input and Fusion character sheets on PostgreSQL
        run: python tests/integration/ui_cases.py
      - name: Adventure battle startup, concession and capture replay recovery
        run: python tests/integration/adventure_lifecycle_cases.py
      - name: Fresh install and three upgrade histories on PostgreSQL
        run: python tests/integration/recovery_migrations.py
      - name: Merged migration graph
        run: python tests/integration/migration_graph.py
      - name: Mandatory combined suite, repeat and reversed suite order
        run: python -B tools/run_mandatory_tests.py
